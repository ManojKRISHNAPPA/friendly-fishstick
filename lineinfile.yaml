---
- name: playbook install the httpd
  hosts: all
  become: true
  vars:
    port: 8082

  tasks:

  - name: install package
    yum:
      name: httpd
      state: installed
    when: ansible_os_family == "RedHat"
    notify: start apache

  - name: install package
    apt:
      name: apache2
      state: present 
    when: ansible_os_family == "Debian"
    notify: start apache2

  - name: copying the index.html
    copy:
      src: /home/ansadmin/index.html
      dest: /var/www/html
      mode: 0666

    
  - name: changing the ports from 80 to 8080...
    lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^Listen ' 
      insertafter: '^#Listen ' 
      line: Listen {{ port }}
    when: ansible_os_family == "RedHat"
    notify: restart apache
  
  - name: changing the ports from 80 to 8080...
    lineinfile:
      path: /etc/apache2/ports.conf
      regexp: '^Listen ' 
      insertafter: '^#/etc/apache2/sites-enabled/000-default.conf' 
      line: Listen {{ port }}
    when: ansible_os_family == "Debian"
    notify: restart apache2



  handlers:
  - name: start apache
    service:
      name: httpd
      state: started

  - name: start apache2
    service:
      name: apache2
      state: started

  - name: restart apache
    service:
      name: httpd
      state: restarted

  - name: restart apache2
    service:
      name: apache2
      state: restarted


    
