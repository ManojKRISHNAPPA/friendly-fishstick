---
- name: Add two numbers in Ansible
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Define the numbers
      set_fact:
        number1: 10
        number2: 15

    - name: Add the two numbers
      set_fact:
        sum: "{{ number1 | int + number2 | int }}"

    - name: Display the sum
      debug:
        msg: "The sum of {{ number1 }} and {{ number2 }} is {{ sum }}"

